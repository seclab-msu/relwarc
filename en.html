---
layout: default
lang: "en"
---

{% assign posts=site.posts | where: "lang", page.lang %}
<div class="posts">
  {% for post in posts %}
    <article class="post">

      <h1><a href="https://blog.secsem.ru{{ post.url }}">{% if post.titleoverride %}{{ post.titleoverride }}{% else %}{{
          post.title }}{% endif %}</a></h1>

      <div class="date">{{ post.date | date: "%B %e, %Y" }}</div>

      <div class="entry">
        {{ post.excerpt }}
      </div>

      <a href="https://blog.secsem.ru{{ post.url }}" class="read-more">Read More</a>
    </article>
  {% endfor %}
</div>
